<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f4f4f4;
            --muted-color: #8c8c8c;
            --border-color: #262626;
            --focus-border: #666666;
            --card-bg: rgba(255, 255, 255, 0.01);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
            color: var(--text-color);
            text-transform: uppercase;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 300;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--muted-color);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--focus-border);
        }

        button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 0.8rem 2.2rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            align-self: flex-start;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            transform: translateY(-2px);
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: var(--muted-color);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form action="/login_action" method="POST">
            <input type="text" name="name_input_login" placeholder="Name" required>
            <input type="password" name="password_input_login" placeholder="Passwort" required>
            <button type="submit">Einloggen</button>
        </form>
        <a href="/register/">Noch kein Konto? Registrieren</a>
    </div>
</body>
</html>
