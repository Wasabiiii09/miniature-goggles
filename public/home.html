<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #f4f4f4;
            --muted-color: #8c8c8c;
            --border-color: #262626;
            --card-bg: rgba(255, 255, 255, 0.01);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* Header / Nav Section */
        .user-nav {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 2rem;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .user-info {
            font-size: 0.95rem;
            color: var(--muted-color);
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .user-info span {
            color: var(--text-color);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        a.btn, button.btn-logout {
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.4rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
        }

        a.btn-primary {
            border-color: var(--text-color);
        }

        a.btn:hover, button.btn-logout:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            border-color: var(--text-color);
            transform: translateY(-2px);
        }

        .inline-form {
            display: inline;
            margin: 0;
        }

        /* Comments Section */
        .comments-section {
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: var(--muted-color);
        }

        .comment-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-item {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            padding: 1.2rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.6;
            transition: border-color 0.3s ease;
        }

        .comment-item:hover {
            border-color: #404040;
        }

        .comment-author {
            font-weight: 500;
            color: var(--text-color);
            letter-spacing: 0.03em;
            margin-right: 0.5rem;
        }

        .comment-text {
            color: #d1d1d1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-nav">
            <h1>Willkommen auf der Pubg!</h1>
            
            {{if .IsLoggedIn}}
                <p class="user-info">Eingeloggt als: <span>{{.User.Name}}</span></p>
                <div class="nav-links">
                    <a href="/profile/" class="btn">Zum Profil</a>
                    <a href="/comment/" class="btn btn-primary">Kommentar schreiben</a>
                    <form action="/log_out" method="POST" class="inline-form">
                        <button type="submit" class="btn-logout">Logout</button>
                    </form>
                </div>
            {{else}}
                <div class="nav-links">
                    <a href="/login/" class="btn btn-primary">Login</a>
                    <a href="/register/" class="btn">Registrieren</a>
                </div>
            {{end}}
        </div>

        <div class="comments-section">
            <h2>Kommentare:</h2>
            <ul class="comment-list">
            {{range .Comments}}
                <li class="comment-item">
                    <span class="comment-author">{{.User.Name}}:</span>
                    <span class="comment-text">{{.Text}}</span>
                </li>
            {{end}}
            </ul>
        </div>
    </div>
</body>
</html>
