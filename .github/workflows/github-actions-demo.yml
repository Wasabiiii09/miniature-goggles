name: Go CI/CD with Docker

run-name: ${{ github.actor }} is running Docker CI/CD for zgowebseit 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgrsaires
          POSTGRES_PASSWORD: kerim197
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 📥 Download dependencies
        run: go mod download

      - name: 🧪 Run tests
        env:
          DB_DSN: postgres://postgrsaires:kerim197@localhost:5432/postgres?sslmode=disable
        run: go test -v ./...

  docker-build-and-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📦 Check out repository code
        uses: actions/checkout@v4

      - name: 🔐 Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy Docker to VPS
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🚀 Pull and Restart Container on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "62.68.75.27"
          username: "root"
          password: "dn07F2e4To"
          script: |
            IMAGE="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest"
            
            docker pull $IMAGE
            
            docker stop zgowebseit-container || true
            docker rm zgowebseit-container || true
            
            docker run -d \
              --name zgowebseit-container \
              --restart always \
              --network host \
              --env-file /opt/zgowebseit/.env \
              $IMAGE
              
            echo "Docker-Deployment erfolgreich abgeschlossen!"