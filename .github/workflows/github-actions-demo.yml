name: Go CI/CD Pipeline

run-name: ${{ github.actor }} is running CI/CD for zgowebseit 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (PostgreSQL)
    runs-on: ubuntu-latest

    # PostgreSQL Test-Datenbank im GitHub Runner starten
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📦 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2' # Passe dies bei Bedarf an deine Go-Version an

      - name: 📥 Download dependencies
        run: go mod download

      - name: 🧪 Run tests
        env:
          DB_DSN: postgres://postgres:password@localhost:5432/testdb?sslmode=disable
        run: go test -v ./...

      - name: 🔨 Build application binary
        run: go build -v -o server-binary ./cmd/server/main.go

      - name: 💾 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server-binary

  deploy:
    name: Deploy to Server (CD)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary

      - name: 🚀 Copy binary to home directory via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "192.168.0.3"
          username: "ponchik"
          password: "mein"
          source: "server-binary"
          target: "./"
      - name: 🔄 Move binary to /opt, set permissions & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "192.168.0.3"
          username: "ponchik"
          password: "mein"
          script: |
            # Ordner erstellen, falls nicht vorhanden
            sudo mkdir -p /opt/zgowebseit
            
            # Binary an den Zielort verschieben (aus dem Home-Verzeichnis)
            sudo mv server-binary /opt/zgowebseit/server-binary
            
            # Rechte anpassen und Dienst neustarten
            sudo chmod +x /opt/zgowebseit/server-binary
            sudo systemctl restart zgowebseit
            echo "Deployment erfolgreich abgeschlossen!"